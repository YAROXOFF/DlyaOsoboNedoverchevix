<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>bool_ka — сайт-визитка команды</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0b; --surface:#131315; --border:#2a2a2d;
    --text:#f2efe8; --muted:#9b978c;
    --gold:#d8c186; --gold-dark:#8d7a46;
    --gold-grad:linear-gradient(135deg,#e6d49b,#9a8650);
    --radius:16px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-behavior:smooth;scroll-padding-top:90px;height:100%}
  *{margin:0;padding:0;box-sizing:inherit}
  body{font-family:'Montserrat','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100%;overflow-x:hidden}
  .container{max-width:1160px;margin:0 auto;padding:0 24px}

  /* ===== Шапка ===== */
  header{position:sticky;top:0;z-index:50;background:rgba(10,10,11,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .header-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 24px}
  .logo{display:flex;align-items:center;gap:12px}
  .logo-mark{width:42px;height:42px;border-radius:10px;background:var(--gold-grad);color:#15130c;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center}
  .logo b{display:block;font-size:16px;font-weight:600;letter-spacing:.02em}
  .logo span{font-size:12px;color:var(--muted)}
  nav ul{display:flex;gap:2px;list-style:none;flex-wrap:wrap}
  nav a{color:var(--muted);text-decoration:none;padding:8px 13px;border-radius:8px;font-size:14px;font-weight:500;transition:.2s}
  nav a:hover{color:var(--gold);background:rgba(216,193,134,.08)}

  /* ===== Главный экран: слайдер участников ===== */
  .stage{position:relative;min-height:calc(100svh - 72px);display:flex;align-items:center;padding:48px 0 96px;overflow:hidden}
  .stage::before{content:"";position:absolute;right:-10%;top:10%;width:620px;height:620px;background:radial-gradient(circle,rgba(216,193,134,.13),transparent 65%);pointer-events:none}
  .slide{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center;width:100%}
  .slide.enter{animation:slideIn .45s ease both}
  .slide.enter.back{animation-name:slideInBack}
  @keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
  @keyframes slideInBack{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
  .eyebrow{display:inline-block;color:var(--gold);font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;margin-bottom:16px}
  .slide h1{font-size:clamp(30px,4.6vw,52px);font-weight:300;line-height:1.15;letter-spacing:-.01em;margin-bottom:12px}
  .slide h1 b{font-weight:700;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .role{font-size:18px;font-weight:600;color:var(--gold);margin-bottom:4px}
  .group{font-size:14px;color:var(--muted);margin-bottom:20px}
  .bio{color:#cfcbc0;font-size:16px;max-width:520px;margin-bottom:26px}
  .traits{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:28px}
  .trait{max-width:150px;font-size:14px;color:#cfcbc0}
  .trait i{display:block;font-style:normal;font-size:13px;color:var(--gold);margin-bottom:6px;padding:2px 0 0 10px;border-left:2px solid var(--gold-dark);border-top:2px solid var(--gold-dark);width:34px}
  .btn{display:inline-block;padding:14px 32px;border-radius:999px;background:var(--gold-grad);color:#15130c;font-weight:600;font-size:15px;text-decoration:none;box-shadow:0 6px 28px rgba(216,193,134,.25);transition:.2s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 10px 34px rgba(216,193,134,.35)}
  .photo{position:relative;justify-self:center;width:min(100%,460px);aspect-ratio:1/1.1;border-radius:24px;overflow:hidden;border:1px solid var(--border)}
  .photo img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;filter:contrast(1.05)}
  .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,10,11,.85),transparent 40%)}
  .avatar{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:300;color:var(--gold);background:radial-gradient(circle at 50% 35%,#24211a,#121214)}
  .photo figcaption{position:absolute;left:0;right:0;bottom:18px;text-align:center;z-index:2}
  .photo figcaption b{display:block;font-size:17px;font-weight:600}
  .photo figcaption span{font-size:13px;color:var(--gold)}

  /* стрелки и счётчик */
  .arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:52px;height:52px;border-radius:50%;border:1px solid var(--gold-dark);background:rgba(10,10,11,.6);color:var(--gold);font-size:24px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center}
  .arrow:hover:not(:disabled){background:var(--gold);color:#15130c}
  .arrow:disabled{opacity:.25;cursor:default}
  .arrow.prev{left:18px}.arrow.next{right:18px}
  .pager{position:absolute;left:0;right:0;bottom:28px;display:flex;align-items:center;justify-content:center;gap:16px;font-size:13px;color:var(--muted);z-index:4}
  .dots{display:flex;gap:8px}
  .dot{width:9px;height:9px;border-radius:50%;border:none;background:var(--border);cursor:pointer;padding:0;transition:.2s}
  .dot.on{background:var(--gold);width:26px;border-radius:6px}
  .counter b{color:var(--gold);font-weight:600}

  /* ===== Секции ===== */
  section.block{padding:84px 0;border-top:1px solid var(--border)}
  .section-title{font-size:30px;font-weight:600;text-align:center;margin-bottom:10px}
  .section-title::after{content:"";display:block;width:44px;height:3px;border-radius:2px;background:var(--gold-grad);margin:14px auto 0}
  .section-sub{text-align:center;color:var(--muted);max-width:640px;margin:0 auto 40px}
  .stats{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:8px}
  .stat{width:150px;padding:22px 10px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
  .stat b{display:block;font-size:30px;color:var(--gold)}
  .stat span{font-size:12px;color:var(--muted)}
  .skills{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .skill{padding:9px 20px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:14px;transition:.2s}
  .skill:hover{border-color:var(--gold);color:var(--gold)}
  .tabs{display:flex;justify-content:center;gap:8px;margin-bottom:28px;flex-wrap:wrap}
  .tab{padding:9px 24px;border-radius:999px;cursor:pointer;background:var(--surface);border:1px solid var(--border);color:var(--muted);font:500 14px 'Montserrat',sans-serif;transition:.2s}
  .tab.active{background:var(--gold-grad);color:#15130c;border-color:transparent;font-weight:600}
  .projects-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
  .project{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:26px;transition:.2s}
  .project:hover{border-color:var(--gold);transform:translateY(-3px)}
  .project-icon{width:46px;height:46px;border-radius:12px;background:rgba(216,193,134,.1);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:14px}
  .project h3{font-size:16px;margin-bottom:6px}
  .project p{color:var(--muted);font-size:14px}
  .contacts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .contact{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 22px;color:var(--text);text-decoration:none;font-size:14px;font-weight:500;transition:.2s}
  .contact:hover{border-color:var(--gold);color:var(--gold)}
  footer{border-top:1px solid var(--border);text-align:center;padding:30px 0;color:var(--muted);font-size:13px}
  footer a{color:var(--gold);text-decoration:none;font-weight:600}

  /* ===== Адаптив ===== */
  @media (max-width:900px){
    .slide{grid-template-columns:1fr;gap:28px}
    .photo{order:-1;width:min(100%,340px)}
    .stage{padding:32px 0 120px}
    .arrow{top:auto;bottom:16px;transform:none;width:46px;height:46px}
    .arrow.prev{left:24px}.arrow.next{right:24px}
    .pager{bottom:26px}
  }
  @media (max-width:520px){
    .header-inner{justify-content:center;text-align:center}
    nav ul{justify-content:center}
    nav a{padding:6px 9px;font-size:13px}
    .stat{width:44%}
    .traits{gap:18px}
  }
</style>
</head>

<section class="block" id="contacts">

</main>

<script>
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
  const TEAM_SIZE = TEAM.length;

  /* --- Шапка, о команде, навыки, подвал --- */
  $('logoMark').textContent = SITE.logo;
  $('teamName').textContent = SITE.name;
  $('teamMotto').textContent = SITE.motto;
  $('aboutText').textContent = SITE.about;
  $('footerText').textContent = SITE.footer;
  $('contactsText').textContent = SITE.contactsText;
  SITE.stats.forEach(s => { const d = el('div', 'stat'); d.append(el('b', '', s.value), el('span', '', s.label)); $('stats').append(d); });
  SITE.skills.forEach(s => $('skillsList').append(el('span', 'skill', s)));
  SITE.contacts.forEach(c => { const a = el('a', 'contact', c.label); a.href = c.href; a.target = '_blank'; a.rel = 'noopener'; $('contactsList').append(a); });
  if (!SITE.contacts.length) $('contacts').querySelector('.contacts').remove();

  /* --- Проекты: вкладки --- */
  const tabsBox = $('tabs');
  function showProjects(key) {
    $('projectsGrid').replaceChildren();
    SITE.projects[key].items.forEach(p => {
      const c = el('div', 'project');
      c.append(el('div', 'project-icon', p.icon), el('h3', '', p.title), el('p', '', p.text));
      $('projectsGrid').append(c);
    });
    tabsBox.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === key));
  }
  Object.keys(SITE.projects).forEach(key => {
    const b = el('button', 'tab', SITE.projects[key].label);
    b.dataset.tab = key;
    b.addEventListener('click', () => showProjects(key));
    tabsBox.append(b);
  });
  showProjects('done');

  /* --- Карусель участников --- */
  let current = 0;
  const slide = $('slide'), prevBtn = $('prevBtn'), nextBtn = $('nextBtn');

  function render(back) {
    const m = TEAM[current];
    slide.replaceChildren();

    const info = el('div', 'info');
    const h1 = el('h1'); h1.append(m.name + ' ', Object.assign(el('b'), { textContent: m.surname }));
    const traits = el('div', 'traits');
    m.traits.forEach((t, i) => { const d = el('div', 'trait'); d.append(el('i', '', String(i + 1).padStart(2, '0')), document.createTextNode(t)); traits.append(d); });
    const cta = el('a', 'btn', 'Навыки команды'); cta.href = '#skills';
    info.append(el('span', 'eyebrow', m.title), h1, el('div', 'role', m.role), ...(m.group ? [el('div', 'group', m.group)] : []), el('p', 'bio', m.bio), ...(m.traits.length ? [traits] : []), cta);

    const fig = el('figure', 'photo');
    const img = m.photo ? el('img') : el('div', 'avatar', m.name[0] + m.surname[0]);
    if (m.photo) { img.src = m.photo; img.alt = 'Фото: ' + m.fullName; }
    const cap = el('figcaption'); cap.append(el('b', '', m.name + ' ' + m.surname), el('span', '', m.role));
    fig.append(img, cap);

    slide.append(info, fig);
    slide.classList.remove('enter', 'back'); void slide.offsetWidth;
    slide.classList.add('enter'); if (back) slide.classList.add('back');

    $('counter').replaceChildren(el('b', '', String(current + 1).padStart(2, '0')), document.createTextNode(' / ' + String(TEAM_SIZE).padStart(2, '0')));
    $('dots').querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('on', i === current));
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === TEAM.length - 1;
  }

  function go(step) {
    const n = current + step;
    if (n < 0 || n >= TEAM.length) return;
    current = n; render(step < 0);
  }

  TEAM.forEach((m, i) => {
    const d = el('button', 'dot'); d.setAttribute('aria-label', m.fullName);
    d.addEventListener('click', () => { const back = i < current; current = i; render(back); });
    $('dots').append(d);
  });
  prevBtn.addEventListener('click', () => go(-1));
  nextBtn.addEventListener('click', () => go(1));
  document.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); });

  /* свайп на телефоне */
  let x0 = null;
  slide.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  slide.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1); x0 = null; });

  render();
</script>
</body>
</html>
